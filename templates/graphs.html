{% extends "layout.html" %}

{% block content %}
  <h1>Grapher</h1>
  <div>
    <form id = "form" method="POST">
      <label class="form-label fw-bold">x axis</label>
      <select class="form-select" name = "x" required>
        <option value = "" disabled selected> Select x-axis</option>
        {%for i in optionsx%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>

      <label class="form-label fw-bold">y axis</label>
      <select class="form-select" name = "y" required>
        <option value = "" disabled selected> Select y-axis</option>
        {%for i in optionsy%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>
      <button type="submit" class="btn px-5 py-2">Make Graph</button>
    </form>
  </div>

<div style="position: relative; width: 100%; max-width: 800px; height: 400px; margin: 0 auto;">
  <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<script>
  const ctx = document.getElementById('myChart');
  const Data = {{ cdata|default([])|tojson }}
  if (Data && Data.length > 0) {
    const hasstrings = Data.some(item => typeof item.x === 'string' && isNaN(Number(item.x))); //checks if the type is string and if the string cannot be turned into int  
    let graphType = 'scatter';
    let chartData = {};
    let chartOptions = {
      responsive: true,
      maintainAspectRatio: false
    };
    if (hasstrings) {
      graphType = 'bar'
      chartData = {
        labels: Data.map(item => String(item.x)), //map gets the x value in the data and appends it into a list. kinda like [for in]
        datasets: [{
          label: 'Graph of {{labelx}} vs. {{labely}}',
          data: Data.map(item => parseFloat(item.y)), 
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          borderColor: 'rgb(54, 162, 235)',
          borderWidth: 1
        }]
      }
      const hasDateObject = Data.some(item => !isNaN(Date.parse(item.x))); //checks if the string is a date
      console.log(hasDateObject)
      if (hasDateObject) {
        chartOptions.scales = {
          x: {
            type: 'time', 
            time: {
              unit: 'month'
            }
          },
          y: {
            beginAtZero: true,
            grace: '5%'
          }
        };
        }
    }
    else {
      graphType = 'scatter';
      //sets the variable to something readable by chart js [{x:"",y:""},{x:"",y:""] and makes the values floats
      const parsedCoordinates = Data.map(item => ({
        x: parseFloat(item.x),
        y: parseFloat(item.y)
      }));

      chartData = {
        datasets: [
          {
            label: 'Graph of {{labelx}} vs. {{labely}}',
            data: parsedCoordinates,
            backgroundColor: 'rgb(54, 162, 235)',
            pointRadius: 6,
            xAxisID: 'x',
            yAxisID: 'y'
          },
          /*
            {
            label: 'Least Squares Regression Line',
            data: regressionData,
            type: 'line',
            borderColor: 'red',
            fill: false,
            pointRadius: 0 // Hide points on the line
          }
          */
        ]
      };
      chartOptions.scales = {
        x: {
          type: 'linear', 
          grace: '5%'
        },
        y: {
          beginAtZero: true,
          grace: '5%'
        }
      };
    }

    //makes the chart
    new Chart(ctx, { 
      type: graphType,
      data: chartData,
      options: chartOptions
    });
}
</script>

{% endblock %}
