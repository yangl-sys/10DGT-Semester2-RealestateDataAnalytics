{% extends "layout.html" %}

{% block content %}
  <h1>Grapher</h1>
  <div>
    <form id = "form" method="POST">
      <label class="form-label fw-bold">x axis</label>
      <select class="form-select" name = "x" required>
        <option value = "" disabled selected> Select x-axis</option>
        {%for i in optionsx%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>

      <label class="form-label fw-bold">y axis</label>
      <select class="form-select" name = "y" required>
        <option value = "" disabled selected> Select y-axis</option>
        {%for i in optionsy%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>
      <button type="submit" class="btn px-5 py-2">Make Graph</button>
    </form>
  </div>

<div style="position: relative; width: 100%; max-width: 800px; height: 400px; margin: 0 auto;">
  <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<script>
  const ctx = document.getElementById('myChart');
  const Data = {{ cdata|default([])|tojson }}
  const trendline = {{ trendlinedata|tojson }}
  if (Data && Data.length > 0) {
    const hasstrings = Data.some(item => typeof item.x === 'string' && isNaN(Number(item.x))); //checks if the type is string and if the string cannot be turned into int  
    let graphType = 'scatter';
    let chartData = {};
    let chartOptions = {
      responsive: true,
      maintainAspectRatio: false
    };
    if (hasstrings) {
      graphType = 'bar'
      chartData = {
        labels: Data.map(item => String(item.x)), //map gets the x value in the data and appends it into a list. kinda like [for in]
        datasets: [{
          label: 'Graph of {{labelx}} vs. {{labely}}',
          data: Data.map(item => parseFloat(item.y)), 
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          borderColor: 'rgb(54, 162, 235)',
          borderWidth: 1
        }]
      }
    }
    else {
      const hasUnixTimestamp = Data.some(item => {
        const num = Number(item.x);
        return Number.isInteger(num) && num > 315532800000;
      });

      graphType = 'scatter';

      chartData = {
        datasets: [
          {
            label: 'Graph of {{labelx}} vs. {{labely}}',
            data: Data.map(item => ({ x: parseFloat(item.x), y: parseFloat(item.y) })), //parses the data to make it readable by js as a float
            backgroundColor: 'rgb(54, 162, 235)',
            pointRadius: 6,
            xAxisID: 'x',
            yAxisID: 'y'
          },
          {
            label: 'Least Squares Regression Line',
            data: trendline,
            type: 'line',
            borderColor: 'red',
            fill: false,
            pointRadius: 0
          }
        ]
      };

      chartOptions.scales = {
        x: {
          type: hasUnixTimestamp ? 'time' : 'linear', //if the data is unix timestamp, type is time, else linear
          ...(hasUnixTimestamp && { time: { unit: 'month' } }), //if unix timestamp, time usnit is month
          title: {
            display: true,
            text: {{ labelx|tojson }},
            color: '#911',
            font: { size: 20, lineHeight: 1.2 },
            padding: { top: 20, left: 0, right: 0, bottom: 0 }
          },
          grace: '5%'
        },
        y: {
          title: {
            display: true,
            text: {{ labely|tojson }},
            color: '#191',
            font: { size: 16 }
          },
          beginAtZero: true,
          grace: '5%'
        }
      };
    }
    //makes the chart
    new Chart(ctx, { 
      type: graphType,
      data: chartData,
      options: chartOptions
    });
  }
</script>

{% endblock %}
