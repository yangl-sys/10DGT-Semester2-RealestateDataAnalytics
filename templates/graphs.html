{% extends "layout.html" %}

{% block content %}
  <h1>Grapher</h1>
  <div>
    <form id = "form" method="POST">
      <label class="form-label fw-bold">x axis</label>
      <select class="form-select" name = "x">
        <option> Select x-axis</option>
        {%for i in options%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>

      <label class="form-label fw-bold">y axis</label>
      <select class="form-select" name = "y">
        <option> Select y-axis</option>
        {%for i in options%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>
      <button type="submit" class="btn px-5 py-2">Make Graph</button>
    </form>
    <img src="{{ url_for('static', filename='graph.png') }}">
  </div>

<div>
  <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>

{% endblock %}
