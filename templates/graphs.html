{% extends "layout.html" %}

{% block content %}
  <h1>Grapher</h1>
  <div>
    <form id = "form" method="POST">
      <label class="form-label fw-bold">x axis</label>
      <select class="form-select" name = "x">
        <option> Select x-axis</option>
        {%for i in options%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>

      <label class="form-label fw-bold">y axis</label>
      <select class="form-select" name = "y">
        <option> Select y-axis</option>
        {%for i in options%}
        <option>
            {{i}}
        </option>
        {%endfor%}
      </select>
      <button type="submit" class="btn px-5 py-2">Make Graph</button>
    </form>
    <img src="{{ url_for('static', filename='graph.png') }}">
  </div>

<div style="position: relative; width: 100%; max-width: 800px; height: 400px; margin: 0 auto;">
  <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById('myChart');
  const Data = {{ cdata|default([])|tojson }}

  if (Data && Data.length > 0) {
    const hasstrings = Data.some(item => typeof item.x === 'string' && isNaN(Number(item.x)));

    let graphtype = 'scatter';
    let chartdata = {};
    let chartoptions = {
      responsive: true,
      maintainAspectRatio: false
    };
    if (hasstrings) {
      graphtype = 'bar'
      chartData = {
        labels: Data.map(item => String(item.x)), //map gets the x value in the data and appends it into a list. kinda like [for in]
        datasets: [{
          label: 'Graph of {{labelx}} vs. {{labely}}',
          data: Data.map(item => parseFloat(item.y)), 
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          borderColor: 'rgb(54, 162, 235)',
          borderWidth: 1
        }]
      };
    }
    
    else {
      // --- SCATTER CHART CONFIGURATION ---
      // If everything is completely numeric, use your original coordinate scatter plot
      graphType = 'scatter';
      
      const parsedCoordinates = rawData.map(item => ({
        x: parseFloat(item.x),
        y: parseFloat(item.y)
      }));

      chartData = {
        datasets: [{
          label: 'Graph of {{labelx}} vs. {{labely}}',

      chartOptions.scales = {

    // 3. INITIALISE COHESIVE CHART ENGINE

}
</script>

{% endblock %}
