{% extends "layout.html" %}

{% block content %}
  <h1>Raw data</h1>
  <body>
    <div>
    <table class="table table-responsive table-striped">
        <thead>
            <tr>
            <th scope="col">House Id</th>
            <th scope="col">Address</th>
            <th scope="col">Date Sold</th>
            <th scope="col">Price</th>
            <th scope="col">Beds</th>
            <th scope="col">Size(m²)</th>
            </tr>
        </thead>
        {%for i in data%}
        <tbody>
            <tr>
            <th scope="row">{{i[0]}}</th>
            <td>{{i[1]}}</td>
            <td>{{i[2]}}</td>
            <td>{{i[3]}}</td>
            <td>{{i[4]}}</td> 
            <td>{{i[5]}}</td> 
            </tr>
        </tbody>
        {%endfor%}
    </table>
    </div>
</body>
{% endblock %}
