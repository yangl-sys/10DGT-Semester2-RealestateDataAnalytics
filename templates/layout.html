<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Predictor | Property Value Estimator</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        --primary-gradient-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        --card-bg-dark: rgba(30, 41, 59, 0.6);
        --card-bg-light: rgba(255, 255, 255, 0.8);
        --glass-border-dark: rgba(255, 255, 255, 0.08);
        --glass-border-light: rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bs-body-bg);
        color: var(--bs-body-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Navbar Styling */
      .navbar-custom {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--glass-border-dark);
      }
      [data-bs-theme="light"] .navbar-custom {
        border-bottom: 1px solid var(--glass-border-light);
      }

      

      .navbar-brand {
        font-weight: 800;
        letter-spacing: -0.02em;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-link {
        font-weight: 500;
        transition: color 0.2s ease-in-out;
      }
      .nav-link:hover {
        color: #7c3aed !important;
      }

      /* Hero & Cards */
      .hero-value {
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      @media (min-width: 768px) {
        .hero-value {
          font-size: 3.5rem;
        }
      }

      .custom-card {
        background-color: var(--card-bg-dark);
        border: 1px solid var(--glass-border-dark);
        backdrop-filter: blur(12px);
        border-radius: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      [data-bs-theme="light"] .custom-card {
        background-color: var(--card-bg-light);
        border: 1px solid var(--glass-border-light);
      }
      .custom-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
      }

      /* Buttons & Badges */
      .gradient-btn {
        background: var(--primary-gradient);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        transition: all 0.2s ease;
      }
      .gradient-btn:hover {
        background: var(--primary-gradient-hover);
        color: #fff;
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
      }

      .bed-chip {
        min-width: 58px;
        border-radius: 0.5rem;
      }

      .badge-soft-emerald {
        background-color: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.25);
        font-weight: 600;
        padding: 0.35em 0.65em;
        border-radius: 0.375rem;
      }

      /* Offcanvas / Drawer Navigation */
      .offcanvas {
        backdrop-filter: blur(16px);
      }
    </style>
  </head>
  <body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-custom bg-body-tertiary bg-opacity-75">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fs-4" href="/">
          <i class="fa-solid me-1 fa-chart-line"></i>Real Predictor
        </a>

        <!-- Offcanvas Mobile Trigger -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Offcanvas / Drawer Menu -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasNavbarLabel">
              <i class="fa-solid fa-compass me-2"></i>Navigation
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 gap-1">
              <li class="nav-item">
                <a class="nav-link px-3" href="/predict"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>Predictions</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3" href="/graphs"><i class="fa-solid fa-chart-column me-2"></i>Graphs</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3" href="/trends"><i class="fa-solid fa-arrow-trend-up me-2"></i>Trends</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3" href="/raw"><i class="fa-solid fa-database me-2"></i>Data</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Injection -->
    <main class="flex-grow-1 py-4">
      <div class="container-fluid px-3 px-md-4">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
